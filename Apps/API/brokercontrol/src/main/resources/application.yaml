spring:
  application:
    name: brokercontrol

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:3000}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}